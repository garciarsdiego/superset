name: Windows Port CI

on:
  push:
    branches:
      - windows-experimental
      - windows-native-port
  pull_request:
    branches:
      - windows-experimental
      - windows-native-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-port-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-checks:
    name: Desktop checks
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Report native Windows build prerequisite state
        shell: pwsh
        run: |
          bun -e "import { checkWindowsNativeBuildPrerequisites } from './apps/desktop/scripts/windows-native-build-prereqs.ts'; console.log(JSON.stringify(checkWindowsNativeBuildPrerequisites(), null, 2));"

      - name: Typecheck desktop
        run: bun run --cwd apps/desktop typecheck

      - name: Run focused Windows port tests
        shell: pwsh
        run: |
          bun test `
            apps/desktop/src/main/lib/agent-setup/agent-wrappers.test.ts `
            apps/desktop/scripts/windows-native-build-prereqs.test.ts `
            apps/desktop/src/renderer/lib/terminal/launch-command.test.ts `
            apps/desktop/src/renderer/lib/external-app-platforms.test.ts `
            apps/desktop/src/renderer/lib/file-manager-labels.test.ts `
            apps/desktop/src/renderer/lib/script-file-imports.test.ts
